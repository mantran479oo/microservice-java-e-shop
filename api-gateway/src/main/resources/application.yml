spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"

jwt:
  enabled: true
  secret: ${JWT_SECRET}
  issuer: project-javajava
